# Template file for local database secrets
# Copy this file to ./config/datasource-secrets.yml and replace placeholders with actual values
# from GitHub Secrets or GCP Secret Manager. Never commit the real datasource-secrets.yml file.
spring:
  datasource:
    url: ${BILLING_DB_URL:jdbc:mysql://<YOUR_DB_HOST>:<PORT>/<DATABASE_NAME>}
    driver-class-name: ${BILLING_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${BILLING_DB_USERNAME:<YOUR_DB_USERNAME>}
    password: ${BILLING_DB_PASSWORD:<YOUR_DB_PASSWORD>}

